name: Validate repository

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install pyyaml -r requirements-test.txt
      - name: Compile Python files
        run: python -m compileall -q ai
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate YAML files
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          for path in pathlib.Path('.').rglob('*.y*ml'):
              if any(part in {'logs', 'target', '.git'} for part in path.parts):
                  continue
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          print('YAML validation passed')
          PY
